# =====================================================================
# Auto-deploy a Cloud Run cuando hay push en la rama mia o en main.
#
# QUE HACE
#   1. Checkout del codigo
#   2. Autentica gcloud usando GCP_SA_KEY (secret encriptado de GitHub)
#   3. Escribe el env.yaml desde GCP_ENV_VARS (otro secret)
#   4. Corre `gcloud run deploy ilus-app --source .` con el comando exacto
#      que viene funcionando manual
#   5. Imprime la URL y revision final
#
# REQUISITOS UNICOS (configurar 1 sola hvez en GitHub):
#   Settings -> Secrets and variables -> Actions -> "New repository secret"
#     GCP_SA_KEY    = contenido del JSON de la SA (ilus-app-498503-9fd9b2388e9d.json)
#     GCP_ENV_VARS  = contenido completo del env.yaml
#
# CUANDO SE DISPARA
#   - Cualquier push a `main`
#   - Cualquier push a la rama de esta sesion
#   - Manualmente desde GitHub UI (Actions -> Run workflow)
#
# CONCURRENCIA
#   Solo 1 deploy a la vez. Si llega otro mientras esta corriendo,
#   espera en cola (no cancela el actual).
# =====================================================================

name: Deploy to Cloud Run

on:
  push:
    branches:
      # SOLO main despliega (2026-06-12, Daniel). Antes también desplegaba la
      # rama de la sesión de transporte → cada sesión pisaba el deploy de la
      # otra (desapareció el Plan Anual 2 veces). Ahora TODA sesión debe
      # mergear a main para llegar a producción: main = fuente única de verdad.
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'deploy_*.ps1'
      - 'smoke_test_*.ps1'
  workflow_dispatch:    # Permite disparar manual desde la UI

# Solo 1 deploy a la vez. Evita race conditions entre sesiones.
concurrency:
  group: cloud-run-deploy
  cancel-in-progress: false

env:
  PROJECT_ID:    ilus-app-498503
  REGION:        southamerica-west1
  SERVICE:       ilus-app
  CLOUDSQL_INST: ilus-app-498503:southamerica-west1:ilus-db

jobs:
  deploy:
    name: Build & deploy to Cloud Run
    runs-on: ubuntu-latest

    # Permisos minimos
    permissions:
      contents: read
      id-token: write    # por si en el futuro pasamos a Workload Identity

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- GATE: tests de regresion ANTES de tocar produccion (Fase 0, plan
      # de mejora integral de Transporte, 2026-07-31) --------------------
      # Corre solo los tests AUTOCONTENIDOS (sin Flask/MySQL/ERP -- extraen
      # la funcion via AST o son modulos puros), asi el gate es rapido y no
      # depende de credenciales. Si un test falla, el deploy NO se ejecuta.
      #
      # tests/test_transport_manifest_ui.py queda EXCLUIDO a proposito: ya
      # fallaba ANTES de esta sesion (filtro Jinja 'dias_fmt' no registrado
      # en el Environment de prueba + una aserción de CSS que se movio a un
      # archivo externo en un refactor anterior) -- no es una regresion de
      # hoy, pero bloquear TODO deploy por un test viejo y roto no es lo
      # correcto. Queda pendiente arreglarlo aparte (no en este PR).
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias mínimas para los tests
        # SOLO lo que los tests realmente importan -- NO requirements.txt
        # completo (playwright/tesseract la harían lenta y frágil solo para
        # correr tests unitarios que no los necesitan).
        # Pillow: helper de PDF multi-página de test_fedex_parse.py.
        # pypdf/pypdfium2: fedex_labels.pdf_count_pages/pdf_split_pages_b64
        # (sin esto el split de PDF multipágina falla silenciosamente y
        # test_caso3_pdf_multipagina reporta 1 etiqueta en vez de 3).
        run: pip install --quiet "Pillow>=10.0.0" "pypdf>=4.0.0" "pypdfium2>=4.30.0"

      - name: Tests de regresión (gate previo al deploy)
        run: |
          set -e
          FAILED=0
          for f in \
            tests/test_contrato_parser.py \
            tests/test_fedex_parse.py \
            tests/test_simpliroute_payload.py \
            tests/test_trafico_buscar_cliente_query.py \
            tests/test_trafico_correlativo_cotizaciones.py \
            tests/test_transport_label_address.py \
            tests/test_transport_productos_json_saldo.py \
            tests/test_transport_caracterizacion.py \
            tests/test_fedex_multibulto_poll.py \
          ; do
            echo "::group::$f"
            if ! python3 "$f"; then
              echo "::error::$f FALLÓ"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "::error::Uno o más tests fallaron — deploy bloqueado."
            exit 1
          fi
          echo "Todos los tests de regresión pasaron."

      # --- AUTENTICAR a Google Cloud usando el secret encriptado ---
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # --- ESCRIBIR env.yaml desde el secret (sin imprimirlo en logs) ---
      - name: Write env.yaml from secret
        env:
          # Credenciales FedEx en secrets PROPIOS (no dentro de GCP_ENV_VARS).
          # Asi agregar/rotar una credencial = setear 1 secret simple, sin tener
          # que re-pegar TODO el env.yaml. GitHub enmascara estos valores en logs.
          FEDEX_RATE_CLIENT_ID:     ${{ secrets.FEDEX_RATE_CLIENT_ID }}
          FEDEX_RATE_CLIENT_SECRET: ${{ secrets.FEDEX_RATE_CLIENT_SECRET }}
          FEDEX_ACCOUNT:            ${{ secrets.FEDEX_ACCOUNT }}
          # Tokens SimpliRoute — uno por transportista (Milling y Felca son
          # cuentas SEPARADAS en SimpliRoute). Mismo patron que FedEx.
          # IMPORTANTE: este deploy usa --env-vars-file, que REEMPLAZA todas
          # las variables del servicio. Cualquier variable seteada a mano en la
          # consola de Cloud Run se PIERDE en el siguiente deploy si no esta
          # aqui. Por eso los tokens deben vivir en GitHub Secrets.
          SIMPLIROUTE_API_TOKEN_MILLING: ${{ secrets.SIMPLIROUTE_API_TOKEN_MILLING }}
          SIMPLIROUTE_API_TOKEN_RAFA:    ${{ secrets.SIMPLIROUTE_API_TOKEN_RAFA }}
          # Token que autentica a Cloud Scheduler contra los endpoints /cron/*.
          # Sin el, esos endpoints solo aceptan llamadas desde localhost — y
          # Cloud Scheduler llama desde fuera, asi que quedarian en 403.
          ILUS_CRON_TOKEN:               ${{ secrets.ILUS_CRON_TOKEN }}
          # CheckWMS (2026-08-03) — API de bodega externa, solo lectura, para
          # autocompletar codigos UA en Incidencias (Servicio Tecnico).
          CHECKWMS_UID_INS:               ${{ secrets.CHECKWMS_UID_INS }}
          CHECKWMS_UID_ERP:               ${{ secrets.CHECKWMS_UID_ERP }}
          # Shipit (2026-08-04) — agregador de couriers, pedido del area para
          # unificar en la plataforma. Autenticacion por 2 headers:
          # X-Shipit-Email + X-Shipit-Access-Token. Aun sin integracion en
          # codigo — los secrets quedan listos para cuando se construya.
          SHIPIT_API_TOKEN:               ${{ secrets.SHIPIT_API_TOKEN }}
          SHIPIT_API_EMAIL:               ${{ secrets.SHIPIT_API_EMAIL }}
        run: |
          # Heredoc: el contenido NO aparece en los logs de Actions
          cat > /tmp/env.yaml <<'EOF_ENV_YAML'
          ${{ secrets.GCP_ENV_VARS }}
          EOF_ENV_YAML

          # --- Inyectar credenciales FedEx desde secrets separados ---
          # Quitar primero cualquier linea FedEx que viniera en GCP_ENV_VARS,
          # para no generar claves YAML duplicadas (gcloud rechaza duplicados).
          grep -vE '^(FEDEX_RATE_CLIENT_ID|FEDEX_RATE_CLIENT_SECRET|FEDEX_ACCOUNT|SIMPLIROUTE_API_TOKEN_MILLING|SIMPLIROUTE_API_TOKEN_RAFA|ILUS_CRON_TOKEN|CHECKWMS_UID_INS|CHECKWMS_UID_ERP|SHIPIT_API_TOKEN|SHIPIT_API_EMAIL):' \
            /tmp/env.yaml > /tmp/env.clean || true
          mv /tmp/env.clean /tmp/env.yaml
          # Garantizar salto de linea final antes de anexar
          [ -n "$(tail -c1 /tmp/env.yaml 2>/dev/null)" ] && echo "" >> /tmp/env.yaml
          append_env() {
            key="$1"; val="$2"
            if [ -n "$val" ]; then
              printf '%s: "%s"\n' "$key" "$val" >> /tmp/env.yaml
              echo "  [+] $key inyectada"
            else
              echo "  [-] $key vacia (secret no seteado en GitHub) — se omite"
            fi
          }
          echo "Credenciales FedEx:"
          append_env FEDEX_RATE_CLIENT_ID     "$FEDEX_RATE_CLIENT_ID"
          append_env FEDEX_RATE_CLIENT_SECRET "$FEDEX_RATE_CLIENT_SECRET"
          append_env FEDEX_ACCOUNT            "$FEDEX_ACCOUNT"
          echo "Tokens SimpliRoute:"
          append_env SIMPLIROUTE_API_TOKEN_MILLING "$SIMPLIROUTE_API_TOKEN_MILLING"
          append_env SIMPLIROUTE_API_TOKEN_RAFA    "$SIMPLIROUTE_API_TOKEN_RAFA"
          echo "Cron (Cloud Scheduler 24/7):"
          append_env ILUS_CRON_TOKEN               "$ILUS_CRON_TOKEN"
          echo "Credenciales CheckWMS:"
          append_env CHECKWMS_UID_INS              "$CHECKWMS_UID_INS"
          append_env CHECKWMS_UID_ERP              "$CHECKWMS_UID_ERP"
          echo "Credenciales Shipit:"
          append_env SHIPIT_API_TOKEN              "$SHIPIT_API_TOKEN"
          append_env SHIPIT_API_EMAIL              "$SHIPIT_API_EMAIL"

          # Verificar que se escribio algo razonable (sin mostrar el contenido)
          BYTES=$(wc -c < /tmp/env.yaml)
          LINES=$(wc -l < /tmp/env.yaml)
          echo "env.yaml escrito: $BYTES bytes, $LINES lineas"
          if [ "$BYTES" -lt 50 ]; then
            echo "::error::El secret GCP_ENV_VARS parece vacio o invalido"
            exit 1
          fi

      # --- DEPLOY a Cloud Run (mismo comando que el manual) ---
      - name: Deploy to Cloud Run
        id: deploy
        run: |
          gcloud run deploy "$SERVICE" \
            --source . \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --add-cloudsql-instances "$CLOUDSQL_INST" \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 4 \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --env-vars-file /tmp/env.yaml \
            --quiet

      # --- INFORMACION del deploy ---
      - name: Show deployed revision and U
        run: |
          REV=$(gcloud run services describe "$SERVICE" \
                --region="$REGION" --project="$PROJECT_ID" \
                --format="value(status.latestReadyRevisionName)")
          URL=$(gcloud run services describe "$SERVICE" \
                --region="$REGION" --project="$PROJECT_ID" \
                --format="value(status.url)")
          echo ""
          echo "=================================================="
          echo "  DEPLOY OK"
          echo "=================================================="
          echo "  Revision: $REV"
          echo "  URL:      $URL"
          echo "  Commit:   ${{ github.sha }}"
          echo "  Branch:   ${{ github.ref_name }}"
          echo "=================================================="

      # --- SMOKE TEST liviano post-deploy ---
      - name: Smoke test endpoints publicos
        run: |
          URL=$(gcloud run services describe "$SERVICE" \
                --region="$REGION" --project="$PROJECT_ID" \
                --format="value(status.url)")
          echo "Esperando 15s para warmup..."
          sleep 15
          FAILED=0
          for PATH_TEST in "/login" "/version"; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "$URL$PATH_TEST" --max-time 30 || echo "ERR")
            if [ "$CODE" = "200" ] || [ "$CODE" = "302" ]; then
              echo "[OK]   $PATH_TEST -> $CODE"
            else
              echo "[FAIL] $PATH_TEST -> $CODE"
              FAILED=$((FAILED+1))
            fi
          done
          if [ "$FAILED" -gt 0 ]; then
            echo "::warning::$FAILED smoke test(s) fallaron pero el deploy ya termino"
          fi

      # --- LIMPIAR el env.yaml por las dudas ---
      - name: Cleanup env.yaml
        if: always()
        run: |
          rm -f /tmp/env.yaml
          echo "env.yaml temporal eliminado"
