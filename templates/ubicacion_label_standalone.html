<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Etiquetas de ubicaciones</title>
<style>
:root {
  --label-w: {{ label_format.w }};
  --label-h: {{ label_format.h }};
}
@page {
  size: {{ label_format.w }} {{ label_format.h }};
  margin: 0;
}
*, *::before, *::after {
  box-sizing: border-box;
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}
html, body {
  width: var(--label-w);
  height: auto;
  margin: 0;
  padding: 0;
  background: #fff;
}
body { font-family: Arial, Helvetica, sans-serif; }

/* 🎨 FIX 2026-09-02 v2 (Daniel, tras ver la primera versión: "no me gustó
   ese, colócale el logo mejor y con más diseño, no más información pero
   sí más formato que se vean más bonitas"). Cambios sobre la v1:
   1) El logo ILUS deja de ir apretado en una columna angosta (44%,
      compartida con texto BODEGA/UBICACIÓN) -- ahora es el PROTAGONISTA
      del header, grande y centrado, sin texto peleándole espacio.
   2) Esquinas redondeadas + franja diagonal inferior (mismo motivo
      hazard-stripe que ya existe en label_standalone.html/repuesto_
      label_standalone.html, aquí SIEMPRE visible -- es un archivo propio,
      no toca el interruptor global --label-footer-stripes de esos dos).
   3) El código ya no flota solo en blanco: vive dentro de una tarjeta
      con borde y esquinas redondeadas, con "UBICACIÓN" como eyebrow
      dentro de la misma tarjeta -- más "formato", cero dato nuevo.
   4) El barcode se enmarca en su propia franja gris clara, en vez de ir
      suelto sobre blanco.
   Contenido sigue exactamente igual de simple que antes: código +
   barcode, nada de producto/dimensiones/peso. */
.label {
  width: var(--label-w);
  height: var(--label-h);
  display: grid;
  grid-template-rows: var(--hdr-h) minmax(0, 1fr) var(--stripe-h);
  overflow: hidden;
  position: relative;
  background: #fff;
  border: var(--label-border) solid #0a0a0a;
  border-radius: var(--label-radius);
  color: #000;
  page-break-after: always;
  break-after: page;
  isolation: isolate;
}
.label:last-child { page-break-after: auto; break-after: auto; }

.label-head {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #0a0a0a;
  border-bottom: var(--accent-h) solid #dc2626;
  padding: var(--hdr-pad-y) var(--hdr-pad-x);
}
.ilus-logo {
  max-width: 100%;
  max-height: 100%;
  display: block;
  object-fit: contain;
  filter: grayscale(1) brightness(0) invert(1);
  image-rendering: crisp-edges;
}

.label-body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--body-gap);
  padding: var(--body-pad-y) var(--body-pad-x);
  overflow: hidden;
}

.codigo-card {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  border: var(--card-border) solid #e5e7eb;
  border-radius: var(--card-radius);
  background: #fafafa;
  padding: var(--card-pad-y) var(--card-pad-x);
}
.codigo-eyebrow {
  color: #dc2626;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .14em;
  font-size: var(--eyebrow-size);
  margin-bottom: var(--eyebrow-gap);
}
.codigo {
  font-weight: 950;
  letter-spacing: 0;
  line-height: 1;
  color: #0a0a0a;
  text-align: center;
  font-size: var(--codigo-size);
  white-space: nowrap;
  font-family: 'JetBrains Mono', Consolas, monospace;
}

.barcode-card {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: var(--card-border) solid #e5e7eb;
  border-radius: var(--card-radius);
  background: #fff;
  padding: var(--barcode-pad-y) var(--barcode-pad-x);
  overflow: hidden;
}
.barcode { width: var(--barcode-w); height: var(--barcode-h); max-height: var(--barcode-h); }

.stripe {
  background: repeating-linear-gradient(135deg, #0a0a0a 0 var(--stripe-w1), #fff var(--stripe-w1) var(--stripe-w2));
}

.label-100x50 {
  --label-border: .3mm;
  --label-radius: 2.4mm;
  --hdr-h: 10mm;
  --accent-h: .6mm;
  --hdr-pad-y: 1.4mm;
  --hdr-pad-x: 8mm;
  --stripe-h: 2.4mm;
  --stripe-w1: 1.6mm;
  --stripe-w2: 2.9mm;
  --body-pad-y: 1.6mm;
  --body-pad-x: 3mm;
  --body-gap: 1.4mm;
  --card-border: .26mm;
  --card-radius: 1.6mm;
  --card-pad-y: 1.4mm;
  --card-pad-x: 2mm;
  --eyebrow-size: 1.75mm;
  --eyebrow-gap: .6mm;
  --codigo-size: 6.6mm;
  --barcode-pad-y: 1.2mm;
  --barcode-pad-x: 2mm;
  --barcode-w: 96%;
  --barcode-h: 9.5mm;
}
.label-150x100 {
  --label-border: .4mm;
  --label-radius: 4mm;
  --hdr-h: 20mm;
  --accent-h: 1mm;
  --hdr-pad-y: 3mm;
  --hdr-pad-x: 16mm;
  --stripe-h: 4mm;
  --stripe-w1: 3mm;
  --stripe-w2: 5.4mm;
  --body-pad-y: 3mm;
  --body-pad-x: 6mm;
  --body-gap: 3mm;
  --card-border: .34mm;
  --card-radius: 3mm;
  --card-pad-y: 3mm;
  --card-pad-x: 4mm;
  --eyebrow-size: 3.4mm;
  --eyebrow-gap: 1.2mm;
  --codigo-size: 13mm;
  --barcode-pad-y: 2.4mm;
  --barcode-pad-x: 4mm;
  --barcode-w: 96%;
  --barcode-h: 17mm;
}
</style>
</head>
<body>
{% set format_key = fmt or label_format.key %}
{% set logo_src = logo_url or url_for('static', filename='Logo.png') %}
{% for u in ubicaciones %}
  <article class="label label-{{ format_key }}">
    <header class="label-head">
      <img class="ilus-logo" src="{{ logo_src }}" alt="ILUS Fitness">
    </header>
    <div class="label-body">
      <div class="codigo-card">
        <span class="codigo-eyebrow">Ubicación · Bodega de Repuestos</span>
        <span class="codigo">{{ u.codigo }}</span>
      </div>
      <div class="barcode-card">
        <svg class="barcode" id="barcode-{{ loop.index0 }}" data-code="{{ u.codigo }}"></svg>
      </div>
    </div>
    <div class="stripe"></div>
  </article>
{% endfor %}

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
  const formatKey = "{{ format_key }}";
  document.querySelectorAll(".barcode").forEach((barcode) => {
    const code = barcode.dataset.code || "";
    if (code) {
      const wrap = barcode.closest(".barcode-card");
      const wrapWidth = wrap ? wrap.clientWidth : 140;
      const density = formatKey === "100x50" ? 10 : 8.5;
      const lineWidth = Math.max(0.8, Math.min(2.4, wrapWidth / Math.max(code.length * density, 1)));
      const height = formatKey === "100x50" ? 34 : 64;
      JsBarcode(barcode, code, {
        format: "CODE128", displayValue: false, lineColor: "#000",
        background: "#fff", width: lineWidth, height, margin: 0
      });
    }
    barcode.dataset.rendered = "1";
  });
});
</script>
</body>
</html>
